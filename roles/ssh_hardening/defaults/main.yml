ssh_hardening_permit_root_login: "no"
ssh_hardening_password_authentication: "no"
ssh_hardening_challenge_response_authentication: "no"
ssh_hardening_use_pam: "yes"
ssh_hardening_max_auth_tries: 3
ssh_hardening_login_grace_time: 30
ssh_hardening_permit_empty_passwords: "no"
ssh_hardening_x11_forwarding: "no"
# Ports sshd listens on. Listing two ports during a migration keeps the
# old path open until the new one is verified. The list must not be empty:
# sshd would fall back to the default 22.
ssh_hardening_ports:
  - 22
# When non empty, only these accounts may log in over SSH. Leave empty to
# keep sshd's default of accepting every local account with a valid key.
# Remote users that only pull or push backups must be listed too.
ssh_hardening_allow_users: []
