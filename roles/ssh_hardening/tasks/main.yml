- name: Validate the SSH port list
  ansible.builtin.assert:
    that:
      - ssh_hardening_ports | length > 0
    fail_msg: >-
      ssh_hardening_ports must contain at least one port. An empty list
      would leave sshd on its default and silently drop the managed ports.

- name: Ensure the sshd config drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the SSH listening ports
  ansible.builtin.template:
    src: ports.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hsp-ports.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart sshd

- name: Validate the effective sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: "PermitRootLogin {{ ssh_hardening_permit_root_login }}"
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: Disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: "PasswordAuthentication {{ ssh_hardening_password_authentication }}"
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: Disable challenge-response authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?KbdInteractiveAuthentication'
    line: "KbdInteractiveAuthentication {{ ssh_hardening_challenge_response_authentication }}"
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: Configure PAM usage
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?UsePAM'
    line: "UsePAM {{ ssh_hardening_use_pam }}"
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: Limit authentication attempts
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxAuthTries'
    line: "MaxAuthTries {{ ssh_hardening_max_auth_tries }}"
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: Set login grace time
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?LoginGraceTime'
    line: "LoginGraceTime {{ ssh_hardening_login_grace_time }}"
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: Disable empty passwords
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitEmptyPasswords'
    line: "PermitEmptyPasswords {{ ssh_hardening_permit_empty_passwords }}"
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: Disable X11 forwarding
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?X11Forwarding'
    line: "X11Forwarding {{ ssh_hardening_x11_forwarding }}"
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: Restrict SSH logins to the allowed users
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AllowUsers\b'
    line: "AllowUsers {{ ssh_hardening_allow_users | join(' ') }}"
    state: "{{ 'present' if ssh_hardening_allow_users | length > 0 else 'absent' }}"
    validate: "sshd -t -f %s"
  notify: Restart sshd
