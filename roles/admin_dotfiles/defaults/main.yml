# Dotfiles layout on the Ansible controller (overlay, file-level):
#
#   <admin_dotfiles_root>/_common/home/                  baseline, all hosts
#   <admin_dotfiles_root>/<inventory_hostname>/home/     host-specific overlay
#
# Both trees mirror the admin user's $HOME exactly. The host overlay
# wins per file path (so you can ship one common config.fish and add a
# host-only conf.d/foo.fish without re-stating the rest).
#
# Set admin_dotfiles_root to "" to disable the role entirely.
admin_dotfiles_root: "{{ inventory_dir }}/../dotfiles"
admin_dotfiles_common_subdir: _common/home
admin_dotfiles_host_subdir: "{{ inventory_hostname }}/home"

# Path of the per-host manifest tracking which files this role currently
# owns. Files listed in the previous manifest but missing from the
# current merged source are removed on the next run, giving strict
# single-source-of-truth semantics for managed paths only - runtime
# state in unmanaged paths is never touched.
admin_dotfiles_manifest: ".config/admin_dotfiles.manifest"
