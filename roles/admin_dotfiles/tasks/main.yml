- name: Resolve admin user home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ admin_user_name }}"

- name: Set admin_dotfiles initial facts
  ansible.builtin.set_fact:
    admin_dotfiles_home: "{{ ansible_facts.getent_passwd[admin_user_name][4] }}"
    admin_dotfiles_enabled: "{{ admin_dotfiles_root | length > 0 }}"

- name: Notice - admin_dotfiles disabled (admin_dotfiles_root is empty)
  ansible.builtin.debug:
    msg: "admin_dotfiles_root is empty, skipping dotfiles sync."
  when: not admin_dotfiles_enabled

- name: Sync dotfiles
  when: admin_dotfiles_enabled
  block:
    - name: Resolve admin_dotfiles_root to a canonical absolute path
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: "realpath -m -- {{ admin_dotfiles_root }}"
      register: admin_dotfiles_root_realpath
      changed_when: false

    - name: Set resolved overlay source paths - _common then host (order matters)
      ansible.builtin.set_fact:
        admin_dotfiles_overlays:
          - "{{ admin_dotfiles_root_realpath.stdout }}/{{ admin_dotfiles_common_subdir }}"
          - "{{ admin_dotfiles_root_realpath.stdout }}/{{ admin_dotfiles_host_subdir }}"

    - name: Discover files in each overlay
      delegate_to: localhost
      become: false
      ansible.builtin.find:
        paths: "{{ item }}"
        recurse: true
        file_type: file
        hidden: true
        excludes:
          - .git
          - .gitignore
          - .gitmodules
          - .gitkeep
      register: admin_dotfiles_finds
      failed_when: false
      loop: "{{ admin_dotfiles_overlays }}"
      loop_control:
        label: "{{ item }}"

    - name: Sync each overlay onto the target (host iteration overrides _common per file)
      ansible.builtin.include_tasks: sync_overlay.yml
      loop: "{{ admin_dotfiles_finds.results }}"
      loop_control:
        loop_var: overlay_find
        label: "{{ overlay_find.item }}"

    - name: Compute merged set of managed relative paths
      vars:
        _common_files: "{{ admin_dotfiles_finds.results[0].files | default([]) | map(attribute='path') | list }}"
        _host_files: "{{ admin_dotfiles_finds.results[1].files | default([]) | map(attribute='path') | list }}"
      ansible.builtin.set_fact:
        admin_dotfiles_managed: >-
          {{ ((_common_files | map('relpath', admin_dotfiles_overlays[0]) | list)
               + (_host_files | map('relpath', admin_dotfiles_overlays[1]) | list))
              | unique | sort }}

    - name: Read previous manifest (if any)
      ansible.builtin.slurp:
        src: "{{ admin_dotfiles_home }}/{{ admin_dotfiles_manifest }}"
      register: admin_dotfiles_old_manifest_raw
      failed_when: false
      changed_when: false

    - name: Determine stale files to remove
      ansible.builtin.set_fact:
        admin_dotfiles_stale: >-
          {{ ((admin_dotfiles_old_manifest_raw.content | default('') | b64decode).splitlines()
              | map('trim')
              | select
              | list)
             | difference(admin_dotfiles_managed) }}

    - name: Remove dotfiles no longer in any overlay
      ansible.builtin.file:
        path: "{{ admin_dotfiles_home }}/{{ item }}"
        state: absent
      loop: "{{ admin_dotfiles_stale }}"
      loop_control:
        label: "{{ item }}"

    - name: Ensure manifest parent directory exists
      ansible.builtin.file:
        path: "{{ admin_dotfiles_home }}/{{ admin_dotfiles_manifest | dirname }}"
        state: directory
        owner: "{{ admin_user_name }}"
        group: "{{ admin_user_name }}"
        mode: "0755"

    - name: Write current manifest
      ansible.builtin.copy:
        content: "{{ (admin_dotfiles_managed | join('\n')) ~ '\n' }}"
        dest: "{{ admin_dotfiles_home }}/{{ admin_dotfiles_manifest }}"
        owner: "{{ admin_user_name }}"
        group: "{{ admin_user_name }}"
        mode: "0644"
