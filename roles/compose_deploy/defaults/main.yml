# Base directory where every stack lives on the target host.
compose_deploy_base_dir: /opt/stacks

# External Docker networks to create before deploying stacks. Useful for a
# shared reverse-proxy network declared as `external: true` in the stacks.
compose_deploy_external_networks: []

# Default ownership for stack directories and files.
# Falls back to root if no interactive admin user is defined.
compose_deploy_owner: "{{ admin_user_name | default('root') }}"
compose_deploy_group: "{{ admin_user_name | default('root') }}"

# Where on the Ansible controller compose source trees live.
#
# Auto-discovery layout (default - recommended for homelab):
#   <src_root>/_common/<stack>/compose.yaml      deployed to every host
#   <src_root>/<inventory_hostname>/<stack>/compose.yaml   this host only
#
# A stack present in both wins from the host-specific directory (full
# directory override - no file-level merging).
#
# Each <stack>/ subtree is copied verbatim to the host, so put any
# .env / Caddyfile / config/ files right next to compose.yaml.
compose_deploy_src_root: "{{ inventory_dir }}/../stacks"
compose_deploy_common_subdir: _common
compose_deploy_host_subdir: "{{ inventory_hostname }}"

# Stacks to deploy.
#
# Leave empty ([]) to use auto-discovery from compose_deploy_src_root
# (recommended).
#
# Override with an explicit list as an escape hatch - useful when you
# need to render a templated .env per host, deploy the same source tree
# under a different name, mark a stack absent, etc.
#
# Each item:
#   name:    Stack name (also the on-host directory and compose project name).
#   state:   present (default) | absent
#   pull:    policy passed to docker_compose_v2 (always | missing | never).
#            Default: missing.
#   src_dir: Optional override for the source tree on the controller.
#            Default: {{ compose_deploy_src_root }}/{{ name }}
#   env:     Dict rendered into a .env file inside the stack directory.
#            Auto-discovered stacks ship their own .env as a static file
#            inside the stack dir; the templated env is escape-hatch only.
#
# Example:
#   compose_deploy_stacks:
#     - name: whoami
#       env:
#         WHOAMI_PORT: "8080"
compose_deploy_stacks: []

# Maximum number of concurrent pulls/builds per `docker compose` invocation.
# Compose defaults to 5, which can trip registry rate limits when a fresh host
# pulls many stacks in one run (observed with ghcr.io). 1 keeps pulls
# sequential; raise it if your registry credentials and link can take it.
compose_deploy_parallel_limit: 1

# Permissions for the stack files synced from the controller.
#
# "preserve" keeps the mode of the source file (Ansible's copy module
# supports it for files). That matters for build contexts: Docker COPY
# preserves the mode, so a stack file synced as 0640 stays unreadable for a
# non-root user inside the image. Keeping the source mode lets a repository
# ship 0644/0755 build-context files without the role forcing them private.
#
# Set an octal mode (for example "0640") to force one for every file.
compose_deploy_file_mode: preserve

# Mode for directories created by the recursive copy. Ansible has no
# "preserve" for directories, so "preserve" means "do not manage directory
# modes": new directories get the system default and existing ones are left
# alone. Set an octal mode to enforce one.
compose_deploy_directory_mode: preserve
