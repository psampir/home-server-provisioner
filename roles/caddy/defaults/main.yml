# --- Source on controller ---
# Directory holding Caddyfile (+ optional conf.d/*.caddy snippets) on the
# controller, synchronized into /etc/caddy/ on the target. Matches the
# compose_deploy / admin_dotfiles convention of sourcing from
# configs/<env>/<thing>/.
#
# If this directory does not exist on the controller, the role is a no-op:
# Caddy is NOT installed and no firewall rules are opened. This makes the
# role safe to leave in playbooks/site.yml for environments that don't want
# a reverse proxy yet - just don't create the directory.
caddy_source_dir: "{{ inventory_dir }}/../caddy"

# --- Package source ---
# Debian ships an old Caddy (2.6 in trixie) that predates named PKI
# authorities, so its Caddyfile dialect differs from upstream images.
# Enable this to install from the official Cloudsmith repository and
# track the upstream release line instead.
caddy_apt_repo: false
caddy_apt_key_url: "https://dl.cloudsmith.io/public/caddy/stable/gpg.key"
caddy_apt_keyring: /usr/share/keyrings/caddy-stable-archive-keyring.asc
caddy_apt_sources: /etc/apt/sources.list.d/caddy-stable.list
caddy_apt_repo_line: >-
  deb [signed-by={{ caddy_apt_keyring }}]
  https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
# Package state. Opting into the official repository also means following
# it, because apt would otherwise keep the older Debian build installed.
caddy_apt_state: "{{ 'latest' if caddy_apt_repo else 'present' }}"

# --- Firewall (UFW) ---
# Caddy needs 80/tcp for ACME HTTP-01 challenges even if every site
# eventually serves on 443 only. 443/tcp is HTTPS; 443/udp is HTTP/3 (QUIC).
# Override caddy_firewall_from with CIDRs for defence-in-depth on a
# WG-only deployment (e.g. ["10.10.0.0/24"] to expose Caddy only to peers).
caddy_open_firewall: true
caddy_firewall_from:
  - any

caddy_open_http: true     # 80/tcp  - required for ACME HTTP-01
caddy_open_https: true    # 443/tcp - HTTPS
caddy_open_http3: true    # 443/udp - HTTP/3 (QUIC), requires caddy_open_https
