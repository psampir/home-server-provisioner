---
# Pick the configuration source for this host.
#
#   <base>/<caddy_host_subdir>/   preferred, one directory per host
#   <base>/                       fallback for single-host layouts
#
# Sets caddy_source_dir_effective and caddy_source_dir_found. Consumers
# must test the flag with `| bool`, because a templated boolean can be
# stored as the string "False".

- name: Resolve the Caddy source base directory
  delegate_to: localhost
  become: false
  check_mode: false
  ansible.builtin.command:
    cmd: "realpath -m -- {{ caddy_source_dir }}"
  register: caddy_source_base_realpath
  changed_when: false

- name: Stat the per-host source directory
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ caddy_source_base_realpath.stdout }}/{{ caddy_host_subdir }}"
  register: caddy_source_host_stat

- name: Stat the flat source directory
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ caddy_source_base_realpath.stdout }}"
  register: caddy_source_flat_stat

- name: Select the source directory for this host
  ansible.builtin.set_fact:
    caddy_source_dir_effective: >-
      {{ (caddy_source_base_realpath.stdout ~ '/' ~ caddy_host_subdir)
         if (caddy_source_host_stat.stat.isdir | default(false))
         else caddy_source_base_realpath.stdout }}
    caddy_source_dir_found: >-
      {{ (caddy_source_host_stat.stat.isdir | default(false))
         or (caddy_source_flat_stat.stat.isdir | default(false)) }}
