- name: Select the Caddy source directory for this host
  ansible.builtin.include_tasks: select_source.yml

- name: Stat the selected Caddyfile on the controller
  when: caddy_source_dir_found | bool
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ caddy_source_dir_effective }}/Caddyfile"
  register: caddy_caddyfile_stat

- name: "Notice - no Caddyfile source found, skipping role"
  when: not (caddy_source_dir_found | bool)
  ansible.builtin.debug:
    msg: >-
      No directory at {{ caddy_source_dir }}/{{ caddy_host_subdir }} or
      {{ caddy_source_dir }} on the controller - Caddy role is a no-op.
      Drop a Caddyfile (and optional conf.d/*.caddy snippets) under one of
      those paths to enable reverse proxy provisioning.

- name: Fail loudly if the selected source dir has no Caddyfile
  when:
    - caddy_source_dir_found | bool
    - not (caddy_caddyfile_stat.stat.exists | default(false))
  ansible.builtin.fail:
    msg: >-
      {{ caddy_source_dir_effective }} exists but contains no Caddyfile.
      Either remove the directory (to disable the role) or add a Caddyfile.

- name: Report the Caddy source in use
  when: caddy_source_dir_found | bool
  ansible.builtin.debug:
    msg: >-
      Using the Caddy configuration from {{ caddy_source_dir_effective }}{{ ''
      if (caddy_source_host_stat.stat.isdir | default(false)) else ' (flat fallback)' }}

# ---- Everything below runs only when a Caddyfile is present -----------------

- name: Ensure the apt keyring directory exists
  when:
    - caddy_caddyfile_stat.stat.exists | default(false)
    - caddy_apt_repo
  ansible.builtin.file:
    path: "{{ caddy_apt_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the official Caddy apt key
  when:
    - caddy_caddyfile_stat.stat.exists | default(false)
    - caddy_apt_repo
  ansible.builtin.get_url:
    url: "{{ caddy_apt_key_url }}"
    dest: "{{ caddy_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Add the official Caddy apt repository
  when:
    - caddy_caddyfile_stat.stat.exists | default(false)
    - caddy_apt_repo
  ansible.builtin.copy:
    content: "{{ caddy_apt_repo_line }}\n"
    dest: "{{ caddy_apt_sources }}"
    owner: root
    group: root
    mode: "0644"
  register: caddy_apt_sources_changed

- name: Remove the official Caddy apt repository when disabled
  when:
    - caddy_caddyfile_stat.stat.exists | default(false)
    - not caddy_apt_repo
  ansible.builtin.file:
    path: "{{ caddy_apt_sources }}"
    state: absent

- name: Refresh the apt cache after adding the Caddy repository
  when:
    - caddy_caddyfile_stat.stat.exists | default(false)
    - caddy_apt_repo
    - caddy_apt_sources_changed is changed
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Install Caddy
  when: caddy_caddyfile_stat.stat.exists | default(false)
  ansible.builtin.apt:
    name: caddy
    state: "{{ caddy_apt_state }}"
    update_cache: true
    cache_valid_time: 3600

- name: Ensure /etc/caddy/conf.d exists
  when: caddy_caddyfile_stat.stat.exists | default(false)
  ansible.builtin.file:
    path: /etc/caddy/conf.d
    state: directory
    owner: root
    group: caddy
    mode: "0750"

- name: Sync Caddyfile from controller
  when: caddy_caddyfile_stat.stat.exists | default(false)
  ansible.builtin.copy:
    src: "{{ caddy_source_dir_effective }}/Caddyfile"
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: "caddy validate --adapter caddyfile --config %s"
  notify: Reload caddy

- name: Discover conf.d snippets on controller
  when: caddy_caddyfile_stat.stat.exists | default(false)
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths: "{{ caddy_source_dir_effective }}/conf.d"
    patterns: "*.caddy"
    file_type: file
  register: caddy_snippets_local
  failed_when: false

- name: Sync conf.d snippets to target
  when:
    - caddy_caddyfile_stat.stat.exists | default(false)
    - (caddy_snippets_local.files | default([])) | length > 0
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/etc/caddy/conf.d/{{ item.path | basename }}"
    owner: root
    group: caddy
    mode: "0640"
  loop: "{{ caddy_snippets_local.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  notify: Reload caddy

- name: Inventory existing snippets on target (for pruning)
  when: caddy_caddyfile_stat.stat.exists | default(false)
  ansible.builtin.find:
    paths: /etc/caddy/conf.d
    patterns: "*.caddy"
    file_type: file
  register: caddy_snippets_remote

- name: Compute orphan snippet paths
  when: caddy_caddyfile_stat.stat.exists | default(false)
  vars:
    _wanted_paths: >-
      {{ (caddy_snippets_local.files | default([]))
         | map(attribute='path') | map('basename')
         | map('regex_replace', '^', '/etc/caddy/conf.d/')
         | list }}
  ansible.builtin.set_fact:
    caddy_orphan_snippets: >-
      {{ (caddy_snippets_remote.files | default([]))
         | map(attribute='path') | list
         | difference(_wanted_paths) }}

- name: Remove orphan snippets
  when:
    - caddy_caddyfile_stat.stat.exists | default(false)
    - (caddy_orphan_snippets | default([])) | length > 0
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ caddy_orphan_snippets }}"
  notify: Reload caddy

- name: Validate full Caddy config after snippet sync
  when: caddy_caddyfile_stat.stat.exists | default(false)
  ansible.builtin.command:
    cmd: caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
  changed_when: false

- name: Ensure caddy service is enabled and running
  when: caddy_caddyfile_stat.stat.exists | default(false)
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started

- name: Open HTTP (80/tcp) in firewall
  when:
    - caddy_caddyfile_stat.stat.exists | default(false)
    - caddy_open_firewall
    - caddy_open_http
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "Caddy HTTP (ACME)"
  loop: "{{ caddy_firewall_from }}"

- name: Open HTTPS (443/tcp) in firewall
  when:
    - caddy_caddyfile_stat.stat.exists | default(false)
    - caddy_open_firewall
    - caddy_open_https
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "Caddy HTTPS"
  loop: "{{ caddy_firewall_from }}"

- name: Open HTTP/3 (443/udp) in firewall
  when:
    - caddy_caddyfile_stat.stat.exists | default(false)
    - caddy_open_firewall
    - caddy_open_https
    - caddy_open_http3
  community.general.ufw:
    rule: allow
    port: "443"
    proto: udp
    from_ip: "{{ item }}"
    comment: "Caddy HTTP/3 (QUIC)"
  loop: "{{ caddy_firewall_from }}"
