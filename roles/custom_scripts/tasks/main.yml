- name: Set custom_scripts enabled fact
  ansible.builtin.set_fact:
    custom_scripts_enabled: "{{ custom_scripts_src_root | length > 0 }}"

- name: Notice - custom_scripts disabled (custom_scripts_src_root is empty)
  ansible.builtin.debug:
    msg: "custom_scripts_src_root is empty; managed scripts will be cleaned up via manifest."
  when: not custom_scripts_enabled

- name: Resolve src_root to a canonical absolute path
  when: custom_scripts_enabled
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    cmd: "realpath -m -- {{ custom_scripts_src_root }}"
  register: custom_scripts_src_root_realpath
  changed_when: false

- name: Set resolved overlay source paths - _common then host (order matters)
  when: custom_scripts_enabled
  ansible.builtin.set_fact:
    custom_scripts_overlays:
      - "{{ custom_scripts_src_root_realpath.stdout }}/{{ custom_scripts_common_subdir }}"
      - "{{ custom_scripts_src_root_realpath.stdout }}/{{ custom_scripts_host_subdir }}"

- name: Discover scripts in each overlay
  when: custom_scripts_enabled
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths: "{{ item }}"
    recurse: false
    file_type: file
    hidden: false
    excludes:
      - .gitkeep
      - .gitignore
      - README.md
  register: custom_scripts_finds
  failed_when: false
  loop: "{{ custom_scripts_overlays }}"
  loop_control:
    label: "{{ item }}"

- name: Build merged source map (host overrides _common per file name)
  when: custom_scripts_enabled
  vars:
    _common_files: "{{ custom_scripts_finds.results[0].files | default([]) | map(attribute='path') | list }}"
    _host_files: "{{ custom_scripts_finds.results[1].files | default([]) | map(attribute='path') | list }}"
    _common_map: "{{ dict(_common_files | map('basename') | zip(_common_files)) }}"
    _host_map: "{{ dict(_host_files | map('basename') | zip(_host_files)) }}"
    _merged: "{{ _common_map | combine(_host_map) }}"
  ansible.builtin.set_fact:
    custom_scripts_effective: "{{ _merged }}"

- name: Compute managed destination paths
  ansible.builtin.set_fact:
    custom_scripts_managed: >-
      {{ (custom_scripts_effective | default({})).keys()
         | map('regex_replace', '^', custom_scripts_prefix)
         | map('regex_replace', '^', custom_scripts_install_dir ~ '/')
         | list | sort }}

- name: Ensure manifest parent directory exists
  ansible.builtin.file:
    path: "{{ custom_scripts_manifest_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read previous manifest (if any)
  ansible.builtin.slurp:
    src: "{{ custom_scripts_manifest_path }}"
  register: custom_scripts_old_manifest_raw
  failed_when: false
  changed_when: false

- name: Determine destination paths to remove (stale)
  vars:
    _previous: >-
      {{ (custom_scripts_old_manifest_raw.content | default('') | b64decode).splitlines()
         | map('trim') | select | list }}
  ansible.builtin.set_fact:
    custom_scripts_to_remove: "{{ _previous | difference(custom_scripts_managed) | sort }}"

- name: Install scripts (force 0755, host wins on collision)
  ansible.builtin.copy:
    src: "{{ item.value }}"
    dest: "{{ custom_scripts_install_dir }}/{{ custom_scripts_prefix }}{{ item.key }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ (custom_scripts_effective | default({})) | dict2items }}"
  loop_control:
    label: "{{ custom_scripts_install_dir }}/{{ custom_scripts_prefix }}{{ item.key }}"

- name: Remove stale scripts no longer in any overlay
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ custom_scripts_to_remove }}"
  loop_control:
    label: "{{ item }}"

- name: Write current manifest
  ansible.builtin.copy:
    content: "{{ (custom_scripts_managed | join('\n')) ~ '\n' }}"
    dest: "{{ custom_scripts_manifest_path }}"
    owner: root
    group: root
    mode: "0644"
