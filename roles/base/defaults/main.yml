base_packages:
  - curl

# Device GRUB is installed to (e.g. /dev/sda). Empty = auto-detect the boot
# disk from /boot and pre-seed the grub-pc debconf question on BIOS hosts, so
# an unattended upgrade never blocks on an interactive prompt.
base_grub_install_device: ""

# Kernel sysctls written to /etc/sysctl.d/99-hsp.conf and applied via
# `sysctl --system` whenever the file changes. User-overridable from
# group_vars / host_vars by re-defining the dict (or by merging into
# it: hash_behaviour=merge is NOT assumed, so override the whole dict
# if you need a different baseline).
#
# Defaults err on the conservative side and only touch knobs that
# matter for self-hosted servers:
#   - vm.swappiness=10        prefer keeping things in RAM (the swap
#                             role assumes the same value)
#   - fs.inotify.max_user_watches  raise the per-user watch limit so
#                             tools like Syncthing / VSCode remote /
#                             docker watch don't ENOSPC on inotify
#   - fs.inotify.max_user_instances same rationale
#   - net.core.rmem_max / wmem_max  bigger socket buffers for
#                             WireGuard + busy reverse-proxy traffic
base_sysctls:
  vm.swappiness: 10
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 512
  net.core.rmem_max: 2621440
  net.core.wmem_max: 2621440
