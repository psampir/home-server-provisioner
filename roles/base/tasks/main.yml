# ---------------------------------------------------------------------------
# Resolver preflight.
#
# A fresh Debian 13 install using ifupdown + dhcpcd can leave
# /etc/resolv.conf without any nameserver. Every apt task below needs DNS, so
# seed a public resolver first. roles/dns_client replaces this placeholder
# with the real resolver configuration later in site.yml.
# ---------------------------------------------------------------------------
- name: Check whether dhcpcd is configured on this host
  ansible.builtin.stat:
    path: /etc/dhcpcd.conf
  register: base_dhcpcd_conf

- name: Keep dhcpcd from overwriting /etc/resolv.conf
  ansible.builtin.lineinfile:
    path: /etc/dhcpcd.conf
    regexp: '^\s*nohook\s+resolv\.conf\s*$'
    line: nohook resolv.conf
    insertbefore: '^(interface|ssid|profile)\s'
    firstmatch: true
  when: base_dhcpcd_conf.stat.exists

- name: Check whether /etc/resolv.conf has a nameserver
  ansible.builtin.command: grep -Eq '^[[:space:]]*nameserver[[:space:]]+[^[:space:]]' /etc/resolv.conf
  register: base_resolv_nameserver
  changed_when: false
  failed_when: false
  check_mode: false

- name: Stat /etc/resolv.conf
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: base_resolv_stat

- name: Remove a stale /etc/resolv.conf symlink before seeding
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when:
    - base_resolv_nameserver.rc != 0
    - base_resolv_stat.stat.islnk | default(false)

- name: Seed /etc/resolv.conf when no nameserver is configured
  ansible.builtin.lineinfile:
    path: /etc/resolv.conf
    line: "nameserver {{ base_resolv_fallback_nameserver }}"
    insertafter: EOF
    create: true
    owner: root
    group: root
    mode: "0644"
  when: base_resolv_nameserver.rc != 0

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Check whether grub-pc (BIOS GRUB) is installed
  ansible.builtin.command: dpkg-query -W -f=${Status} grub-pc
  register: base_grub_pc_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Detect boot disk for grub-pc pre-seed
  ansible.builtin.shell: |
    set -euo pipefail
    src=$(findmnt -no SOURCE /boot 2>/dev/null || findmnt -no SOURCE /)
    pk=$(lsblk -no PKNAME "$src" | head -n1)
    if [ -n "$pk" ]; then
      echo "/dev/$pk"
    else
      echo "$src"
    fi
  register: base_grub_boot_disk
  changed_when: false
  check_mode: false
  when:
    - base_grub_install_device == ''
    - base_grub_pc_status.stdout is search('^install ok ')

- name: Pre-seed grub-pc install device (avoid postinst prompt during upgrade)
  ansible.builtin.debconf:
    name: grub-pc
    question: grub-pc/install_devices
    vtype: multiselect
    value: "{{ base_grub_install_device or base_grub_boot_disk.stdout }}"
  when: base_grub_pc_status.stdout is search('^install ok ')

- name: Finish any pending dpkg configuration (e.g. previously failed grub-pc postinst)
  ansible.builtin.command: dpkg --configure -a
  register: base_dpkg_configure
  changed_when: base_dpkg_configure.stdout != '' or base_dpkg_configure.stderr != ''
  when: base_grub_pc_status.stdout is search('^install ok ')

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: safe

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Render kernel sysctls (/etc/sysctl.d/99-hsp.conf)
  ansible.builtin.template:
    src: 99-hsp.conf.j2
    dest: /etc/sysctl.d/99-hsp.conf
    owner: root
    group: root
    mode: "0644"
  notify: base_sysctl_apply
