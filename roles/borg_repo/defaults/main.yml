---
# borg_repo - server/target side of the backup pipeline. Runs on
# backup_targets hosts. Creates a dedicated `borg` user, hosts one borg
# repository per source host under /srv/borg/<source>/<repo>, and
# authorizes each source's SSH key under an APPEND-ONLY, path-restricted
# forced command so a compromised source can add but never delete or
# overwrite history.
#
# Because append-only forbids client-side pruning, this role owns
# retention: a local maintenance timer runs `borg prune` + `borg compact`
# per repo with full local access (no append-only restriction), enforcing
# the retention policy declared by each source in borgmatic_repositories.
#
# The role is data-driven by the SOURCES: it scans every inventory host's
# borgmatic_repositories for entries whose `target` is this host. No repos
# need to be declared here.

# --- Encryption ------------------------------------------------------------
# Passphrase used to initialize managed repos and to run prune/compact.
# Same value the sources use (single secret). From ansible-vault in prod.
# Any printable character is supported (escaped on write).
borg_repo_passphrase: "{{ borgmatic_passphrase | default(vault_borgmatic_passphrase | default('')) }}"

# Borg encryption mode for `borg init`. Keep in sync with the sources.
borg_repo_encryption_mode: repokey-blake2

# --- Retention fallback ----------------------------------------------------
# Applied to repos whose source entry omits a `retention:` block.
borg_repo_keep_daily: 7
borg_repo_keep_weekly: 4
borg_repo_keep_monthly: 6

# --- Maintenance schedule --------------------------------------------------
# Local prune + compact pass. Runs after the nightly backup window.
borg_repo_maintenance_schedule: "*-*-* 05:00:00"
borg_repo_maintenance_randomized_delay: "30m"

# --- Integrity check schedule ----------------------------------------------
# Separate monthly pass. `borg check` reads repository metadata and archive
# manifests; it is much heavier than prune/compact, so it does not share the
# nightly timer. Keep the static `--verify-data` flag off for this run.
borg_repo_check_schedule: "*-*-01 06:00:00"
borg_repo_check_randomized_delay: "30m"
borg_repo_check_verify_data: false
borg_repo_check_repository_only: false
borg_repo_check_bin: /usr/local/bin/hsp-borg-check

# Quarterly deep pass. The same script runs with BORG_CHECK_VERIFY_DATA=1,
# which adds --verify-data. It decrypts and hashes every chunk, so it has its
# own timer and low I/O priority. Off by default; enable it on backup targets
# that can afford the hours of I/O.
borg_repo_verify_enabled: false
borg_repo_verify_schedule: "*-01,04,07,10-02 04:00:00"
borg_repo_verify_randomized_delay: "30m"

# Maintenance failures are routed to hsp-notify via the unit's
# OnFailure=hsp-notify-failure@%n.service hook (see templates).

# --- Identity & paths (rarely overridden) ----------------------------------
borg_repo_user: borg
borg_repo_group: borg
borg_repo_home: /var/lib/borg
# Parent directory holding one subdirectory per source host. The sources
# read this back from hostvars to build their push URL, so if you relocate
# it (e.g. onto a large data disk) set it in the INVENTORY (group_vars),
# not here: a role default is not visible to the borgmatic play, which runs
# in an earlier play, so the two sides would disagree about the path and
# backups would break silently.
borg_repo_base: /srv/borg
borg_repo_conf_dir: /etc/hsp-borg
borg_repo_env_path: /etc/hsp-borg/borg.env
borg_repo_maintenance_bin: /usr/local/bin/hsp-borg-maintenance
