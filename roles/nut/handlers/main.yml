---
# udev handlers run before Restart NUT: the new rule must be loaded and
# applied to the device before the driver is restarted, otherwise the driver
# starts again without permission to open the UPS.
- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload-rules
  listen: nut_udev_reload
  changed_when: false

- name: Trigger udev for USB devices
  ansible.builtin.command: udevadm trigger --subsystem-match=usb
  listen: nut_udev_reload
  changed_when: false

- name: Restart NUT
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: >-
    {{ ['nut-server.service', 'nut-monitor.service']
       + (nut_ups | map(attribute='name')
          | map('regex_replace', '^', 'nut-driver@')
          | map('regex_replace', '$', '.service')
          | list) }}
  failed_when: false
