- name: Validate inventory wiring (unique vpn_ip, hub count, client fields)
  ansible.builtin.include_tasks: assert.yml

- name: Install WireGuard
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure /etc/wireguard exists with safe permissions
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check whether private key already exists
  ansible.builtin.stat:
    path: "/etc/wireguard/{{ wireguard_interface }}.privkey"
  register: wireguard_privkey_stat

- name: Generate private key (in-place, never leaves the host)
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    wg genkey > /etc/wireguard/{{ wireguard_interface }}.privkey
  args:
    executable: /bin/bash
    creates: "/etc/wireguard/{{ wireguard_interface }}.privkey"
  when: not wireguard_privkey_stat.stat.exists

- name: Read private key
  ansible.builtin.slurp:
    src: "/etc/wireguard/{{ wireguard_interface }}.privkey"
  register: wireguard_privkey_raw
  no_log: true

- name: Derive public key from private key
  ansible.builtin.shell: "wg pubkey < /etc/wireguard/{{ wireguard_interface }}.privkey"
  register: wireguard_pubkey_cmd
  changed_when: false
  check_mode: false

- name: Write public key to disk (persisted for --limit re-provision resilience)
  ansible.builtin.copy:
    content: "{{ wireguard_pubkey_cmd.stdout }}"
    dest: "/etc/wireguard/{{ wireguard_interface }}.pub"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  changed_when: false

- name: Cache pubkey and privkey as facts (privkey only for templating locally)
  ansible.builtin.set_fact:
    wireguard_pubkey: "{{ wireguard_pubkey_cmd.stdout }}"
    wireguard_privkey: "{{ wireguard_privkey_raw.content | b64decode | trim }}"
  no_log: true

- name: Enable IP forwarding (hub only)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/99-wireguard.conf
  when:
    - wireguard_role == "hub"
    - wireguard_enable_ip_forward

- name: Slurp hub public key (for peer config on --limit re-provision)
  ansible.builtin.slurp:
    src: "/etc/wireguard/{{ wireguard_interface }}.pub"
  register: wireguard_hub_pubkey_slurp
  delegate_to: "{{ wireguard_hub_host }}"
  when:
    - wireguard_role == "peer"
  ignore_unreachable: true
  no_log: true

- name: Resolve hub pubkey (prefer slurped, fall back to hostvars)
  ansible.builtin.set_fact:
    wireguard_hub_pubkey: >-
      {{ (wireguard_hub_pubkey_slurp.content | b64decode | trim)
         if (wireguard_hub_pubkey_slurp is not skipped
             and wireguard_hub_pubkey_slurp.content is defined
             and wireguard_hub_pubkey_slurp.unreachable | default(false) == false)
         else hostvars[wireguard_hub_host].wireguard_pubkey | default('') }}
  when: wireguard_role == "peer"
  no_log: true

- name: Detect WAN interface for NAT (default route)
  ansible.builtin.shell: |
    set -o pipefail
    ip -o -4 route show default | awk '{print $5; exit}'
  args:
    executable: /bin/bash
  register: wireguard_wan_iface_cmd
  changed_when: false
  check_mode: false
  when:
    - wireguard_role == "hub"
    - wireguard_enable_nat
    - wireguard_wan_interface == ""

- name: Resolve effective WAN interface
  ansible.builtin.set_fact:
    wireguard_wan_interface_effective: >-
      {{ wireguard_wan_interface
         if wireguard_wan_interface != ''
         else wireguard_wan_iface_cmd.stdout | default('') }}
  when: wireguard_role == "hub"

- name: Collect peer public keys from remote hosts
  ansible.builtin.slurp:
    src: "/etc/wireguard/{{ wireguard_interface }}.pub"
  register: wireguard_peer_pubkey_slurp
  delegate_to: "{{ item }}"
  when:
    - wireguard_role == "hub"
    - hostvars[item].wireguard_role | default('peer') == 'peer'
    - hostvars[item].vpn_ip is defined
    - item != inventory_hostname
  loop: "{{ groups['servers'] | default([]) }}"
  ignore_unreachable: true
  no_log: true

- name: Build peer pubkey lookup dict
  ansible.builtin.set_fact:
    wireguard_peer_pubkeys: >-
      {{
        wireguard_peer_pubkeys | default({})
        | combine({
            item.item: (item.content | b64decode | trim)
          })
      }}
  loop: "{{ wireguard_peer_pubkey_slurp.results | default([]) }}"
  when:
    - wireguard_role == "hub"
    - item is not skipped
    - item.content is defined
    - not (item.unreachable | default(false))
  no_log: true

- name: Render wg0.conf for the hub
  ansible.builtin.template:
    src: wg0.hub.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  when: wireguard_role == "hub"
  notify: Restart wireguard

- name: Render wg0.conf for managed peers
  ansible.builtin.template:
    src: wg0.peer.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  when: wireguard_role == "peer"
  notify: Restart wireguard

- name: Enable and start wg-quick service
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started

- name: Open WireGuard UDP port in firewall (hub only)
  community.general.ufw:
    rule: allow
    port: "{{ wireguard_listen_port }}"
    proto: udp
    from_ip: "{{ item }}"
    comment: "WireGuard"
  loop: "{{ wireguard_firewall_from }}"
  when:
    - wireguard_role == "hub"
    - wireguard_open_firewall

- name: Allow forwarding between WireGuard peers (hub only)
  community.general.ufw:
    route: true
    rule: allow
    interface_in: "{{ wireguard_interface }}"
    interface_out: "{{ wireguard_interface }}"
    comment: "WireGuard peer-to-peer transit"
  when:
    - wireguard_role == "hub"
    - wireguard_open_firewall

# NOTE: Client .conf + QR rendering is intentionally NOT done here.
# `make provision` deploys [Peer] sections to the hub but never writes
# client artifacts to disk on the controller. Run `make wireguard-render` to
# generate build/<env>/wireguard/<name>.{conf,png} on demand (see
# playbooks/wireguard_clients.yml and docs/wireguard-clients.md).
