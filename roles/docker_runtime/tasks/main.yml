- name: Install prerequisites for the Docker apt repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_runtime_apt_key_url }}"
    dest: "{{ docker_runtime_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris: "{{ docker_runtime_apt_repo_url }}"
    suites:
      - "{{ docker_runtime_apt_suite }}"
    components: "{{ docker_runtime_apt_components }}"
    architectures:
      - "{{ docker_runtime_apt_arch | trim }}"
    signed_by: "{{ docker_runtime_apt_keyring }}"
    state: present
    enabled: true
  notify: Refresh apt cache

- name: Refresh apt cache before installing Docker (if repo changed)
  ansible.builtin.meta: flush_handlers

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name: "{{ docker_runtime_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: "{{ docker_runtime_service_enabled }}"
    state: "{{ docker_runtime_service_state }}"

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_runtime_users }}"
  when: docker_runtime_users | length > 0
