# --- Docker apt repository (official upstream) ---
docker_runtime_apt_key_url: https://download.docker.com/linux/debian/gpg
docker_runtime_apt_keyring: /etc/apt/keyrings/docker.asc
docker_runtime_apt_repo_url: https://download.docker.com/linux/debian
docker_runtime_apt_suite: "{{ ansible_facts['distribution_release'] }}"
docker_runtime_apt_components:
  - stable
docker_runtime_apt_arch: >-
  {{ 'amd64' if ansible_facts['architecture'] == 'x86_64'
     else ('arm64' if ansible_facts['architecture'] == 'aarch64'
     else ansible_facts['architecture']) }}

# --- Packages ---
docker_runtime_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# --- Service ---
docker_runtime_service_enabled: true
docker_runtime_service_state: started

# --- Daemon configuration (/etc/docker/daemon.json) ---
# Set to false to leave /etc/docker/daemon.json entirely unmanaged
# (e.g. if you hand-tune it outside Ansible).
docker_runtime_manage_daemon_json: true

# Container log rotation. Without this, json-file logs grow unbounded
# until they fill the disk - a classic self-hosting footgun. These
# defaults cap each container at 3 × 10 MiB = 30 MiB of logs.
docker_runtime_log_driver: json-file
docker_runtime_log_opts:
  max-size: "10m"
  max-file: "3"

# Extra daemon.json keys merged on top of the log settings above.
# Override to add e.g. {"default-address-pools": [...], "dns": [...]}.
# Keys here win over the generated log-driver/log-opts.
docker_runtime_daemon_extra: {}

# The effective daemon.json document. Rarely overridden directly -
# prefer the granular vars above. Exposed so advanced users can
# replace the whole document if needed.
docker_runtime_daemon_config: >-
  {{ {'log-driver': docker_runtime_log_driver,
      'log-opts': docker_runtime_log_opts}
     | combine(docker_runtime_daemon_extra) }}

# --- Users granted access to the docker socket ---
# Defaults to the interactive admin user (if admin_user role is in play).
# Override with an explicit list to grant access to other accounts.
docker_runtime_users: >-
  {{ [admin_user_name]
     if (admin_user_name | default('') | length > 0)
     else [] }}
