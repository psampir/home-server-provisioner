service_user_name: ansible
service_user_shell: /bin/bash
# Public key authorized for the service user (and, by default, the admin
# user). Reads SSH_PUBKEY_FILE from .env when set, otherwise the controller's
# standard ed25519 key.
service_user_ssh_pubkey: "{{ lookup('file', lookup('env', 'SSH_PUBKEY_FILE') | default('~/.ssh/id_ed25519.pub', true)) }}"
