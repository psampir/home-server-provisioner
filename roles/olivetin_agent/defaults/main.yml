# Host operations exposed through the OliveTin console.
#
# Disabled by default: an environment must opt in with a dedicated SSH key
# and an explicit command allowlist. The role creates the agent user and
# renders an exact sudo policy; the operation scripts are supplied by the
# environment through custom_scripts. It never grants a general shell or
# unrestricted apt/docker access.
olivetin_agent_enabled: false
olivetin_agent_user: olivetin
olivetin_agent_ssh_public_keys: []

# Exact commands the OliveTin SSH user may run through sudo. Each entry must
# be an absolute path with fixed arguments; wildcards are rejected. The
# scripts themselves are owned by the environment: ship them with
# custom_scripts from configs/<env>/scripts/ and list their installed paths
# here. Reference implementations live in configs/example/scripts/_common/.
olivetin_agent_allowed_commands: []

# Optional client key for the host that runs OliveTin itself. Point this at
# a root-owned 0600 path on the OliveTin host; the stack mounts it read-only.
olivetin_agent_client_key_path: ""
olivetin_agent_client_private_key: ""
olivetin_agent_client_key_owner: "1000"
olivetin_agent_client_key_group: "1000"
