# Beszel agent, installed as a small Go binary and a systemd service.
#
# The agent connects outbound to the hub over WebSocket, so no inbound port
# has to be opened. Disabled by default: an environment must opt in with a
# hub URL and the universal token/key generated in the hub.
beszel_agent_enabled: false
beszel_agent_version: "0.21.1"
beszel_agent_binary_url: >-
  https://github.com/henrygd/beszel/releases/download/v{{ beszel_agent_version }}/beszel-agent_linux_amd64.tar.gz
beszel_agent_binary_sha256: "3b6ee592632ec03b9a43312e99a40203a7b3d83fe40dd0c25acda1eb915ea7c0"
beszel_agent_bin: /usr/local/bin/beszel-agent

beszel_agent_user: beszel
beszel_agent_data_dir: /var/lib/beszel-agent
beszel_agent_system_name: "{{ inventory_hostname }}"
beszel_agent_hub_url: ""
beszel_agent_key: ""
beszel_agent_token: ""
beszel_agent_listen: 45876
beszel_agent_package_updates_interval: "1h"
# Comma-separated mountpoints or devices shown as extra disk usage charts.
beszel_agent_extra_filesystems: ""
# Explicit GPU collector list, e.g. "intel_gpu_top". Empty auto-detects.
beszel_agent_gpu_collector: ""
# Intel's i915 PMU needs perf_event_paranoid <= 2 even with CAP_PERFMON on
# Debian's 6.12 kernel. Applied only when intel_gpu_top is selected.
beszel_agent_perf_event_paranoid: 2
# Comma-separated "path[:type]" list. Empty disables SMART; a non-empty value
# also enables SMART for devices found by the smartctl scan.
beszel_agent_smart_devices: ""
# Comma-separated device paths excluded from SMART polling.
beszel_agent_smart_exclude: ""
# Extra supplementary groups for the service (e.g. disk, render, video).
beszel_agent_extra_groups: []
# Ambient capabilities for the service (e.g. CAP_SYS_RAWIO, CAP_PERFMON).
beszel_agent_capabilities: []

# Monitor Docker containers on this host. This grants the agent access to
# the Docker socket through the docker group, which is root-equivalent for
# reads. Keep it off on hosts without Docker or where that is not wanted.
beszel_agent_docker: false
