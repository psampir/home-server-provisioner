- name: Base system provisioning
  hosts: servers
  roles:
    - hostname
    - timezone_locale
    - time_sync
    - service_user
    - base
    - admin_user
    - admin_dotfiles
    - ssh_hardening
    - notifications
    - auto_updates
    - journal
    - fail2ban
    - firewall
    - wireguard
    - swap
    - storage
    - network_mounts
    - smart_monitoring
    - borgmatic
    - custom_scripts
    - systemd_units
    - scheduled_jobs

- name: VPN hub and resolver provisioning
  hosts: vpn_server
  roles:
    - dnsmasq
    - caddy

- name: Application server provisioning
  hosts: app_servers
  roles:
    - dns_client
    - docker_runtime
    - compose_deploy

- name: Backup repository targets
  hosts: backup_targets
  roles:
    - borg_repo

- name: Update local SSH config
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  roles:
    - local_ssh_config
