---
- name: Deploy Docker Compose stacks
  hosts: app_servers
  roles:
    - { role: compose_deploy, tags: [compose_deploy, stacks] }
    # Stack changes move database files around: a rename or a removal leaves
    # the rendered /etc/hsp/db-dump.json pointing at a path that no longer
    # exists, and the next borgmatic run aborts in its before_everything hook.
    # Render the dump config with every stack deploy so the two cannot drift.
    - { role: db_dump, tags: [db_dump, stacks] }
