[defaults]
roles_path = roles
remote_user = ansible
host_key_checking = False
interpreter_python = /usr/bin/python3
inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo, .example
# Vault password file is supplied per-environment by the Makefile as
# $ANSIBLE_VAULT_PASSWORD_FILE = configs/$(ENV)/.vault_pass. We intentionally
# don't set it here so the choice stays with the Makefile (and so direct
# `ansible-playbook` invocations remain explicit). See README "Secrets
# management" for details.

[privilege_escalation]
become = True
become_method = sudo
become_user = root
