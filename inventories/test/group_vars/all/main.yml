# SSH public key to authorize on the service user.
# In the test environment this is read from the same key used by test-env.sh.
service_user_ssh_pubkey: "{{ lookup('file', lookup('env', 'SSH_PUBKEY_FILE') | default('~/.ssh/id_ed25519.pub', true)) }}"

# --- admin_user role ---
admin_user_name: testadmin
admin_user_shell: fish
admin_user_extra_packages:
  - fish
  - zoxide
  - fastfetch

# --- firewall role --- open whoami port for smoke testing
firewall_allow_rules:
  - { port: 8080, proto: tcp, comment: "whoami (test stack)" }

# --- compose_deploy role ---
compose_deploy_stacks:
  - name: whoami
    env:
      WHOAMI_PORT: "8080"
