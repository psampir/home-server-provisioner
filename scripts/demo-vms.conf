# demo VM definitions (for scripts/incus-env.sh)
#
# Spins up two Incus VMs that serve as the targets for the demo
# environment - a long-lived showcase deployment of the provisioner with
# copyparty + forgejo as example Compose stacks behind Caddy.
#
# Format (same as test-vms.conf):
#   VM_NAME:GROUP[,GROUP...][:KEY=VAL,KEY=VAL...]
#
# Names are prefixed with `demo-` because Incus VM names are global -
# this avoids collisions if you also keep the test env (hsp-app, hsp-vpn)
# alive at the same time.

demo-hsp-vpn:vpn_server:vpn_ip=10.10.0.1,wireguard_role=hub
demo-hsp-app:app_servers:vpn_ip=10.10.0.2
