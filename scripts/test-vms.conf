# Test VM definitions
#
# Each line: VM_NAME:GROUP[,GROUP...]
# Groups must match inventory groups (app_servers, backup_targets,
# vpn_servers). A VM can belong to several groups (comma-separated,
# no spaces) - e.g. a single-box home setup where the same host runs
# apps, serves DNS, and is the VPN hub.
# VMs are launched as Incus VMs from the image set in INCUS_IMAGE
# (default: images:debian/13 - minimal, shaped post-launch to mirror a
# fresh netinst install with sshd + initial user).

hsp-app:app_servers
hsp-vpn:vpn_servers
